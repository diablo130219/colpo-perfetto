<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Colpo Perfetto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="noise"></div>
<div class="bg-glow"></div>

<div class="app">

  <!-- TOP NAV TABS -->
  <nav class="tab-bar">
    <button class="tab active" data-tab="cp1">Colpo Perfetto 1</button>
    <button class="tab" data-tab="cp2">Colpo Perfetto 2</button>
    <button class="tab" data-tab="cp3">Colpo Perfetto 3</button>
    <button class="tab tab-bilancio" data-tab="bilancio">Bilancio</button>
  </nav>

  <!-- ===== PAGINE COLPO PERFETTO ===== -->
  <div id="page-cp1" class="page active"></div>
  <div id="page-cp2" class="page"></div>
  <div id="page-cp3" class="page"></div>

  <!-- ===== PAGINA BILANCIO ===== -->
  <div id="page-bilancio" class="page">
    <div class="bil-header">
      <div class="hero-eyebrow">Riepilogo globale</div>
      <h2 class="bil-title">Bilancio</h2>
    </div>
    <div class="bil-grid" id="bil-grid"></div>
    <div class="bil-totals" id="bil-totals"></div>
  </div>

</div>

<script src="app.js"></script>
</body>
</html>
